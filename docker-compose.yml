services:

  # ── PostgreSQL + pgvector ──────────────────────────────────────────────
  # Same image as the pgvector-nutribot container already running on the
  # RTX 3050 host. If that host container stays as the DB, don't run this
  # service too — point DATABASE_URL/PGVECTOR_URL at it instead and omit
  # `pgvector` from `docker compose up`.
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector-nutribot
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nutribot
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutribot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Patient chat bot (app.py) — mirrors nutribot.service ───────────────
  # `docs_api` below shares this exact image (same Dockerfile/context) via
  # `image:` — only one build, not two identical 18GB images.
  nutribot:
    build: .
    image: bare_nutrichatbot:latest
    container_name: nutribot
    env_file: .env
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://postgres:postgres@pgvector:5432/nutribot
      PGVECTOR_URL: postgresql://postgres:postgres@pgvector:5432/nutribot
    ports:
      - "8000:8000"
    volumes:
      # Without this, the container's HF cache starts empty and re-downloads
      # BAAI/bge-m3 (~2GB) on every start, which alone blows past gunicorn's
      # --timeout (found live 2026-08-18 verifying this image: a request
      # that's normally 30-90s took >120s and got SIGABRT'd mid-flight).
      # Bind-mounts the host's already-populated cache instead.
      - ~/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      pgvector:
        condition: service_healthy

  # ── Docs API (docs_api.py) — mirrors docs_api.service ───────────────────
  # Patient-free document Q&A. Reuses the same PGVector base_knowledge
  # collection as `nutribot` above, but never touches patients/clients/
  # chat_messages — same image, different entrypoint module.
  docs_api:
    image: bare_nutrichatbot:latest
    container_name: docs_api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@pgvector:5432/nutribot
      PGVECTOR_URL: postgresql://postgres:postgres@pgvector:5432/nutribot
    ports:
      - "8100:8100"
    volumes:
      # Same embedding model, same cold-start-timeout issue — see nutribot's
      # volumes comment above.
      - ~/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      pgvector:
        condition: service_healthy
    command: uvicorn docs_api:app --host 0.0.0.0 --port 8100

volumes:
  pgvector_data:
